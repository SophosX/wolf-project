# Wolf Radar — Scraper-Cron
# YouTube + TikTok laufen alle 4 Stunden; Instagram nur 1x taeglich
# (eigener Schedule-Eintrag 05:30 UTC — IG rate-limitet aggressiv).
# Manuell via workflow_dispatch laufen alle drei Quellen.
# Kandidaten + agent_run-Protokolle gehen nach Supabase (DATEN_MODUS=supabase).
# Auch bei Agenten-Fehlern schreibt lauf.py sein Protokoll — die App zeigt
# Ausfaelle im Agenten-Status-Panel statt still zu scheitern.

name: radar-cron

on:
  schedule:
    - cron: "0 */4 * * *"   # alle 4 Stunden (UTC): YouTube + TikTok
    - cron: "30 5 * * *"    # 1x taeglich (UTC): nur Instagram
  workflow_dispatch: {}      # manueller Start im GitHub-UI: alle Quellen

# Nie zwei Laeufe parallel (Merge-Semantik schuetzt zwar, aber unnoetig)
concurrency:
  group: radar-cron
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Instagram: bevorzugt Apify (zuverlaessig); ohne APIFY_TOKEN faellt der Lauf
      # auf gallery-dl mit optionalem Session-Cookie zurueck (siehe README).
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
      DATEN_MODUS: supabase
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install --quiet yt-dlp gallery-dl requests

      - name: ffmpeg bereitstellen (fuer yt-dlp-Untertitel)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Quellen bestimmen
        id: quellen
        # 4h-Takt: YouTube+TikTok | Taeglicher 05:30-Lauf: nur Instagram
        # (schont IG-Rate-Limits) | Manueller Start: alles.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "nur=youtube,tiktok,instagram" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5 * * *" ]; then
            echo "nur=instagram" >> "$GITHUB_OUTPUT"
          else
            echo "nur=youtube,tiktok" >> "$GITHUB_OUTPUT"
          fi

      - name: Radar-Lauf (${{ steps.quellen.outputs.nur }})
        id: lauf
        # lauf.py schreibt agent_runs selbst (auch bei Teilfehlern) und
        # beendet nur mit Exit 1, wenn ueberhaupt nichts gefunden wurde.
        run: python scraper/lauf.py --nur "${{ steps.quellen.outputs.nur }}"

      - name: Transkript-Backfill (nur taeglicher Lauf)
        # Neue Kandidaten werden im Radar-Lauf direkt transkribiert; dieser
        # Backfill holt 1x taeglich Nachzuegler nach (z.B. YouTube-429-Faelle,
        # Instagram-Posts, deren CDN-URL beim Fund schon abgelaufen war).
        if: github.event.schedule == '30 5 * * *' || github.event_name == 'workflow_dispatch'
        run: python scraper/lauf.py --transkribiere

      - name: Notfall-Protokoll bei hartem Absturz
        # Greift nur, wenn lauf.py selbst gecrasht ist (z.B. SyntaxError,
        # Netz komplett weg) und daher KEIN agent_run schreiben konnte.
        if: failure()
        env:
          PYTHONPATH: scraper
        run: |
          python - <<'PY'
          import speicher
          speicher.speichere_agent_run({
              "quelle": "cron",
              "gefunden": 0, "neu": 0, "analysiert": 0, "geflaggt": 0,
              "fehler": ["radar-cron: Lauf hart abgestuerzt — GitHub-Actions-Log pruefen"],
              "dauer_s": 0,
          })
          print("Notfall-agent_run geschrieben")
          PY
