# Wolf Radar + Landing auf einem VPS — drei Container, ein Befehl:
#   cp deploy/.env.server.beispiel .env.server   (Keys eintragen)
#   docker compose up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - radar

  radar:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
    restart: unless-stopped
    env_file: .env.server
    volumes:
      - daten:/app/daten
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scraper:
    build:
      context: .
      dockerfile: deploy/scraper.Dockerfile
    restart: unless-stopped
    # tini als PID 1: supercronic crasht als PID 1 beim Job-Fork
    # ("Failed to fork exec"), als Kindprozess läuft es sauber
    init: true
    env_file: .env.server
    volumes:
      - daten:/app/daten
    depends_on:
      - radar # radar seedet das gemeinsame Volume beim Erststart

volumes:
  daten:
  caddy_data:
  caddy_config:
